spring.application.name=territorio

# Banco H2 gravado em ARQUIVO (pasta "dados" na raiz do projeto).
# Por isso o historico sobrevive ao fechar e abrir o programa.
spring.datasource.url=jdbc:h2:file:./dados/territorio
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas sozinho
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console limpo para o menu aparecer bonito
spring.main.banner-mode=off
logging.level.root=WARN
